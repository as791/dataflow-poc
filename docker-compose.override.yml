# LOCAL TEST OVERRIDE — not for commit.
# Container egress to Cloudflare R2 is blocked on this host, so the in-cluster
# ollama sidecar can't pull a model. Point the API at the host's Ollama
# (already running on :11434 with qwen2.5vl) so the AI builder can be tested.
services:
  api:
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5vl:7b
  # Serve the web app on :3000 so it matches APP_URL / GOOGLE_REDIRECT_URI
  # (Google SSO callback). Base compose maps web to :3002.
  web:
    ports:
      - "3000:80"
