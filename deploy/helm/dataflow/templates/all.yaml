            - {name: TASK_QUEUE, value: dynamic-activities-{{ $env }}}
            - {name: WORKER_PRIVATE_KEY_PATH, value: /secrets/worker-keypair.pem}
          volumeMounts:
            - {name: secrets, mountPath: /secrets, readOnly: true}
            - {name: connectors, mountPath: /app/connectors/manifests, readOnly: true}
      volumes:
        - name: secrets
          hostPath: {path: {{ printf "%s/secrets" $.Values.hostPath | quote }}, type: Directory}
        - name: connectors
          hostPath: {path: {{ printf "%s/connectors/manifests" $.Values.hostPath | quote }}, type: Directory}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: workflow-worker-{{ $env }}}
spec:
  replicas: 1
  selector: {matchLabels: {app: workflow-worker-{{ $env }}}}
  template:
    metadata:
      labels: {app: workflow-worker-{{ $env }}}
      annotations:
        checksum/secrets: {{ toJson $.Values.secrets | sha256sum | quote }}
    spec:
      containers:
        - name: worker
          image: {{ $.Values.images.app }}
          imagePullPolicy: Never
          command: [workflow-worker]
          env:
            - {name: TEMPORAL_ADDRESS, value: temporal:7233}
            - {name: TEMPORAL_NAMESPACE, value: {{ $env }}}
            - {name: TASK_QUEUE, value: dynamic-dag-{{ $env }}}
            - {name: NODE_ENV, value: {{ ternary "production" "development" $.Values.runtime.production | quote }}}
            - name: TEMPORAL_PAYLOAD_ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: dataflow-secrets, key: temporalPayloadKey}}
