# Restrict in-namespace traffic to what's actually needed: default-deny all
# ingress, then explicit allows per service. Only ingress is restricted here
# (egress is left open, e.g. for SMTP/GCS/OAuth calls out to the internet).
#
# NOTE: kind's default CNI (kindnet, see deploy/kind/dataflow.yaml) does not
# enforce NetworkPolicy, so in the dev/demo kind cluster these objects are
# created but traffic is not actually restricted. They take effect on any
# NetworkPolicy-enforcing CNI (Calico, Cilium, etc.), which is what a real
# production cluster would run.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-web-ingress}
spec:
  podSelector: {matchLabels: {app: web}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: TCP, port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-api-ingress}
spec:
  podSelector: {matchLabels: {app: api}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: web}}}]
      ports: [{protocol: TCP, port: 4000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-postgres-ingress}
spec:
  podSelector: {matchLabels: {app: postgres}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchExpressions: [{key: app, operator: In, values: [api, activity-worker-test, activity-worker-prod, temporal, db-backup]}]}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-redis-ingress}
spec:
  podSelector: {matchLabels: {app: redis}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchExpressions: [{key: app, operator: In, values: [api, activity-worker-test, activity-worker-prod]}]}
      ports: [{protocol: TCP, port: 6379}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-clickhouse-ingress}
spec:
  podSelector: {matchLabels: {app: clickhouse}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchExpressions: [{key: app, operator: In, values: [api, activity-worker-test, activity-worker-prod]}]}
      ports: [{protocol: TCP, port: 8123}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-temporal-ingress}
spec:
  podSelector: {matchLabels: {app: temporal}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchExpressions: [{key: app, operator: In, values: [api, activity-worker-test, activity-worker-prod, workflow-worker-test, workflow-worker-prod, temporal-ui, temporal-namespaces]}]}
      ports: [{protocol: TCP, port: 7233}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-temporal-ui-ingress}
spec:
  podSelector: {matchLabels: {app: temporal-ui}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ollama-ingress}
spec:
  podSelector: {matchLabels: {app: ollama}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: api}}}]
      ports: [{protocol: TCP, port: 11434}]
