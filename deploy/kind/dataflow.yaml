kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dataflow
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: __REPO_ROOT__
        containerPath: /workspace
    extraPortMappings:
      - containerPort: 30002
        hostPort: 3002
        protocol: TCP
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30082
        hostPort: 8082
        protocol: TCP
      - containerPort: 30088
        hostPort: 8088
        protocol: TCP
