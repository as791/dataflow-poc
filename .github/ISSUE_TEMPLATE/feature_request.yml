name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome! Check existing issues first to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or use-case, not the solution yet.
      placeholder: "When I want to do X, I have to do Y which is annoying because Z."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other approaches did you consider?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend / UI
        - API
        - Connectors
        - Temporal workflows / workers
        - Lineage / contracts
        - Monitoring / alerts
        - Auth / multi-tenant
        - Docs
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am willing to open a PR for this if the idea is accepted.
          required: false
