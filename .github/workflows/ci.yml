name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/workflow-go/go.mod
          cache-dependency-path: apps/workflow-go/go.sum

      - name: Unit tests — shared (mermaid round-trip)
        run: npm -w @dataflow/shared test
      - name: Unit tests — web run graph
        run: npm -w @dataflow/web test
      - name: Build web
        run: npm -w @dataflow/web run build
      - name: Go tests with race detector
        working-directory: apps/workflow-go
        run: go test -race ./...
      - name: Go vet
        working-directory: apps/workflow-go
        run: go vet ./...

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: docker compose config --quiet
