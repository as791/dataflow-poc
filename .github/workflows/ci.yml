name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/workflow-go/go.mod
          cache-dependency-path: apps/workflow-go/go.sum

      - name: Build frontend workspaces
        run: npm run build
      - name: Build Go services
        working-directory: apps/workflow-go
        run: go build ./cmd/...

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/workflow-go/go.mod
          cache-dependency-path: apps/workflow-go/go.sum

      - name: Unit tests — shared (mermaid round-trip)
        run: npm -w @dataflow/shared test
      - name: Unit tests — web run graph
        run: npm -w @dataflow/web test
      - name: Go tests with race detector
        working-directory: apps/workflow-go
        run: go test -race ./...
      - name: Go vet
        working-directory: apps/workflow-go
        run: go vet ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/workflow-go/go.mod
          cache-dependency-path: apps/workflow-go/go.sum
      - name: Scan Go dependencies for known vulnerabilities
        working-directory: apps/workflow-go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: docker compose config --quiet
