name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/workflow-go/go.mod
          cache-dependency-path: apps/workflow-go/go.sum

      - name: Build frontend workspaces
        run: npm run build
      - name: Build Go services
        working-directory: apps/workflow-go
        run: go build ./cmd/...

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/workflow-go/go.mod
          cache-dependency-path: apps/workflow-go/go.sum

      - name: Unit tests — shared (mermaid round-trip)
        run: npm -w @dataflow/shared test
      - name: Unit tests — web run graph
        run: npm -w @dataflow/web test
      - name: Go tests with race detector
        working-directory: apps/workflow-go
        run: go test -race ./...
      - name: Go vet
        working-directory: apps/workflow-go
        run: go vet ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan reachable Git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact=100 --no-banner .
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/workflow-go/go.mod
          cache-dependency-path: apps/workflow-go/go.sum
      - name: Scan Go dependencies for known vulnerabilities
        working-directory: apps/workflow-go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: docker compose config --quiet

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render chart in dev mode
        run: helm template deploy/helm/dataflow > /dev/null
      - name: Production render must fail without required secrets
        run: |
          if helm template deploy/helm/dataflow --set runtime.production=true > /dev/null 2>&1; then
            echo "helm template succeeded in production mode without required secrets" >&2
            exit 1
          fi
      - name: Production render succeeds with all required secrets set
        run: >-
          helm template deploy/helm/dataflow
          --set runtime.production=true
          --set secrets.jwt=dummy
          --set secrets.oauthKey=dummy
          --set secrets.temporalPayloadKey=dummy
          --set secrets.appUrl=https://dataflow.example.com
          --set secrets.databaseUrl=postgres://u:p@h:5432/db
          --set secrets.appDatabaseUrl=postgres://u:p@h:5432/db
          --set secrets.postgresPassword=dummy
          --set secrets.redisUrl=redis://h:6379
          --set secrets.redisPassword=dummy
          --set secrets.googleClientId=dummy
          --set secrets.googleClientSecret=dummy
          --set secrets.smtpFrom=noreply@example.com
          --set secrets.smtpUser=dummy
          --set secrets.smtpPass=dummy
          > /dev/null
