# Manual deploy to the DigitalOcean droplet created by the Provision Droplet
# workflow (or deploy/droplet/deploy.sh). Resolves the droplet's IP through
# doctl by name, then updates the stack over SSH.
#
# Required repository secrets:
#   DIGITALOCEAN_ACCESS_TOKEN   DO API token (read is enough here)
#   DROPLET_SSH_KEY             private key whose public half is on the droplet
name: Deploy to Droplet

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main
      name:
        description: Droplet name
        required: true
        default: dataflow

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: droplet
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Resolve droplet IP
        id: droplet
        run: |
          IP=$(doctl compute droplet get "${{ inputs.name }}" --format PublicIPv4 --no-header)
          [ -n "$IP" ] || { echo "droplet '${{ inputs.name }}' not found" >&2; exit 1; }
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          HOST: ${{ steps.droplet.outputs.ip }}
          REF: ${{ inputs.ref }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@$HOST" \
            "set -euo pipefail
             cd /opt/dataflow
             git fetch origin \"$REF\"
             git checkout --detach FETCH_HEAD
             docker compose -f docker-compose.yml -f deploy/droplet/docker-compose.droplet.yml up -d --build
             docker image prune -f"
          echo "✓ deployed $REF to $HOST" >> "$GITHUB_STEP_SUMMARY"
