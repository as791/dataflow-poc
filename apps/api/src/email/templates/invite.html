<!doctype html>
<html><body style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:#0b0d17;color:#e5e7eb;margin:0;padding:32px;">
  <div style="max-width:480px;margin:0 auto;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:28px;">
    <h2 style="margin:0 0 12px;color:#a5b4fc;">You've been invited to {{tenantName}}</h2>
    <p style="opacity:.85;line-height:1.55;"><b>{{inviter}}</b> invited you to collaborate on DataFlow. This link expires in 24 hours.</p>
    <p style="margin:24px 0;">
      <a href="{{link}}" style="display:inline-block;padding:10px 18px;background:#6366f1;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;">Accept invite</a>
    </p>
    <p style="font-size:12px;opacity:.55;">Not expecting this? Ignore the email — the link will expire on its own.</p>
  </div>
</body></html>
